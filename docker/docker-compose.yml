services:
  ldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      - LDAP_ORGANISATION=MyOrg
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=LDAP_password
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./ldap_data:/var/lib/ldap
      - ./ldap_config:/etc/ldap/slapd.d
    restart: always

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=ldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "8081:80"
    depends_on:
      - ldap
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-namesrv
    command: nameserver
    ports:
      - "9876:9876"
    restart: always

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-broker
    command: broker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    restart: always

  rocketmq-dashboard:
    image: styletang/rocketmq-console-ng:latest
    container_name: rocketmq-dashboard
    ports:
      - "8082:8080"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Drocketmq.config.isVIPChannel=false
    depends_on:
      - rocketmq-namesrv
    restart: always

  # ── Workflow engine server (Spring Boot) ──
  # Build the jar first: mvn -pl workflow-engine-server -am package -DskipTests
  # MySQL runs outside this compose (login-mysql container / host install),
  # reached via host.docker.internal:3306.
  app:
    build: ../workflow-engine-server
    container_name: wf-app
    environment:
      - SPRING_PROFILES_ACTIVE=redis
      # E2E/curl callers use the legacy header; browser users use session tokens.
      - AUTH_HEADER_COMPAT=true
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/workflow_engine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    ports:
      - "8080:8080"
    depends_on:
      - redis
    restart: always

  # ── Designer frontend (nginx + static build) ──
  web:
    build: ../workflow-engine-web
    container_name: wf-web
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: always

volumes:
  redis_data: