server:
  port: 8081

spring:
  application:
    name: workflow-engine-mcp
  ai:
    mcp:
      server:
        name: workflow-engine
        version: 1.0.0
        # Streamable HTTP transport (single /mcp endpoint, supported by
        # Claude Code / Cursor and other modern MCP clients).
        protocol: streamable
        type: SYNC
        enable-tool-change-notifications: false

wf:
  engine:
    # Where the workflow-engine-server REST API lives.
    base-url: ${WF_ENGINE_URL:http://localhost:8080/api}
    # Preferred auth: a session token issued by POST /api/auth/login. Set via
    # WF_MCP_TOKEN; works even when the engine disables header compatibility.
    token: ${WF_MCP_TOKEN:}
    # Fallback identity when no token is set (requires auth.header-compat-enabled
    # on the engine). Tenant filtering applies to this user like a human.
    user: ${WF_MCP_USER:mcp-agent}

logging:
  level:
    io.modelcontextprotocol: WARN
    org.springframework.ai.mcp: WARN
