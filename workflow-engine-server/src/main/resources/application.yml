spring:
  config:
    import: optional:file:./application-local.yml,optional:file:./workflow-engine-server/application-local.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:redis}
  datasource:
    # MySQL — credentials come from env vars or application-local.yml
    url: jdbc:mysql://localhost:3306/workflow_engine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
---
spring:
  config:
    activate:
      on-profile: "!memory"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
---
spring:
  config:
    activate:
      on-profile: memory
